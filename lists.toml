[fetch]
concurrency = 16
timeout_secs = 30
retries = 2
retry_delay_ms = 500
max_redirects = 5
expand_includes = true
max_include_depth = 4
user_agent = "StayBrave/0.1 (filter-list optimizer; https://github.com/itsrody/StayBrave)"

[output]
file = "output/StayBrave-Classic.txt"

# Header metadata written to the top of the list. Title, description, and
# expires are emitted as ABP-standard `! Key: value` lines so adblock managers
# can display and auto-update the list; version is the generation timestamp.
title = "StayBrave Classic"
description = "StayBrave Classic is a merged, de-duplicated, sorted filter list generated by the same optimization pipeline as StayBrave, intended for Firefox uBlock Origin 1.74+ in addition to (or instead of) the lists uBO ships built-in. It combines EasyList, AdGuard, Fanboy, and StevenBlack sources, excludes uBO's own built-in lists, and applies the same algorithmic rewrite and subsumption passes to reduce rule count without broadening blocking."
# Matches the publish workflow cadence (every 3rd day of the month).
expires = "3 days"
homepage = "https://github.com/itsrody/StayBrave"

# Rules referencing functionality Brave's engine cannot execute are dropped.
# The defaults below match the resources adblock-rust/Brave ships. Redirect
# resource values are canonicalized (uBO aliases, `abp-resource:` prefix) by
# the normalizer before this allowlist is consulted.
[filter]
scriptlets = true
redirect_allowlist = [
  "1x1.gif", "2x2.png", "3x2.png", "32x32.png",
  "empty",
  "noop.js", "noop.txt", "noop.html", "noop.css", "noop.json",
  "noop-1s.mp4", "noop-2s.mp4", "noop-3s.mp4",
  "noop-0.1s.mp3", "noop-0.5s.mp3",
  "noop-vast2.xml", "noop-vast3.xml", "noop-vast4.xml", "noop-vmap1.xml",
  "google-analytics_analytics.js",
  "googletagmanager_gtm.js",
  "googlesyndication_adsbygoogle.js",
  "googletagservices_gpt.js",
  "google-ima.js",
  "amazon_ads.js",
]

# Cosmetic-filter cost controls. These rewrites make the engine's cosmetic
# matching faster and its channel routing more predictable, and all of them
# only remove rules that are provably covered by another (surviving) rule.
# Each can be disabled individually; the defaults are safe.
[filter.cosmetic_cost]
# Pure-CSS `##.a, .b, .c` comma lists are split into individual rules. The
# engine keys cosmetic rules on the first class/id token only, so the comma
# list is delivered (and evaluated) in full only when `.a` is present; splitting
# fixes that routing bug. This is a correctness fix and additionally improves
# match precision, so it is on by default.
split_comma_lists = true
# Pass 2: remove cosmetic rules dominated by a strictly-broader (same-selector)
# or cheaper (bare class/id token) rule in a channel that covers the victim's
# scope. Example: `##.ad` removes `##div.ad`. DOM-identical, provably covered.
subsume_selectors = true
# Pass 3: remove procedural rules (`:has-text`, `:matches-css`, ...) whose
# unprocessed base selector is covered by a plain rule, and de-duplicate
# procedural variants across host names. Generic procedural selectors never
# survive parsing (`:has-text` requires a host scope), so this only touches
# host-scoped rules.
subsume_procedural = true

