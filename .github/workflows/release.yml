name: Build and publish StayBrave-Classic.txt

on:
  schedule:
    # Runs at midnight UTC every 3rd day of the month (~every 72h).
    - cron: "0 0 */3 * *"
  workflow_dispatch:

concurrency:
  group: publish
  # Only the newest build matters; cancel any queued run so it cannot race
  # the commit/push step.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Generate and publish StayBrave-Classic.txt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Generate StayBrave-Classic.txt
        run: node src/main.js

      - name: Verify output
        run: |
          test -s output/StayBrave-Classic.txt
          grep -q '^! Title: StayBrave Classic' output/StayBrave-Classic.txt || { echo "unexpected output header"; exit 1; }
          grep -q '^! Version: ' output/StayBrave-Classic.txt || { echo "missing version metadata"; exit 1; }
          grep -q '^! Expires: ' output/StayBrave-Classic.txt || { echo "missing expires metadata"; exit 1; }
          echo "output OK: $(wc -l < output/StayBrave-Classic.txt) lines"
          # Full gate: every rule must parse with uBO's own static-filter parser,
          # the whole file must compile through the real StaticNetFilteringEngine
          # with zero dropped lines, and a sample of simple option-less rules must
          # still block synthetic requests.
          node examples/verify.js output/StayBrave-Classic.txt

      - name: Commit and push StayBrave-Classic.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/StayBrave-Classic.txt
          git commit -m "Update StayBrave-Classic.txt ($(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main