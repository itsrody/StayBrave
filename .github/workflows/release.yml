name: Build and publish StayBrave.txt

on:
  schedule:
    # Runs at midnight UTC every 3rd day of the month (~every 72h).
    - cron: "0 0 */3 * *"
  workflow_dispatch:

concurrency:
  group: publish
  # Only the newest build matters; cancel any queued run so it cannot race
  # the commit/push step.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Generate and publish StayBrave.txt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build staybrave
        run: cargo build --release

      - name: Generate StayBrave.txt
        run: ./target/release/staybrave --config lists.toml --output output/StayBrave.txt

      - name: Verify output
        run: |
          test -s output/StayBrave.txt
          grep -q '^! Title: StayBrave' output/StayBrave.txt || { echo "unexpected output header"; exit 1; }
          grep -q '^! Version: ' output/StayBrave.txt || { echo "missing version metadata"; exit 1; }
          grep -q '^! Expires: ' output/StayBrave.txt || { echo "missing expires metadata"; exit 1; }
          echo "output OK: $(wc -l < output/StayBrave.txt) lines"
          # Full gate: builds the adblock-rust engine from the list, probes a
          # sample of every simple rule for liveness, and rejects any cosmetic
          # rule that survived with a dead operator or an unsplit procedural
          # comma list.
          cargo run --release --example verify -- output/StayBrave.txt

      - name: Commit and push StayBrave.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/StayBrave.txt
          git commit -m "Update StayBrave.txt ($(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
